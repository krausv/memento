name: Memento
options:
  bundleIdPrefix: cz.memento
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Memento:
    type: application
    platform: macOS
    sources:
      - Memento
    info:
      path: Memento/Info.plist
      properties:
        CFBundleDisplayName: Memento
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_NAME: Memento
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: cz.memento.app
  MementoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MementoTests
    dependencies:
      - target: Memento
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.memento.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Memento:
    build:
      targets:
        Memento: all
    test:
      targets:
        - MementoTests
