name: Release

# Vydání: `git tag v0.2.0 && git push --tags` sestaví, podepíše a notarizuje Memento.dmg
# a přiloží ho k GitHub vydání pro daný tag. Aplikace si nejnovější vydání denně zjišťuje
# přes API (`releases/latest`) a nabídne stažení.
#
# Verze aplikace se bere z tagu (v0.2.0 → 0.2.0), číslo buildu z čísla běhu.
#
# Potřebné secrety repozitáře (Settings → Secrets and variables → Actions):
#   MACOS_CERT_P12_BASE64  base64 certifikátu "Developer ID Application" (.p12)
#                          (export z Klíčenky, pak: base64 -i cert.p12 | pbcopy)
#   MACOS_CERT_PASSWORD    heslo zvolené při exportu .p12
#   NOTARY_APPLE_ID        Apple ID pro notarizaci
#   NOTARY_TEAM_ID         Team ID (u tohoto Developer ID 25PN83L22C)
#   NOTARY_PASSWORD        heslo pro aplikace (account.apple.com → Přihlášení a zabezpečení)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # Aplikace cílí na macOS 27; runner musí mít Xcode s odpovídajícím SDK.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # Rozbitý kód nesmí skončit ve vydání.
      - name: Run unit tests
        run: |
          xcodegen generate
          xcodebuild -scheme Memento test

      # Bez podpisových secretů proběhne běh zeleně a DMG se přeskočí.
      - name: Check signing secrets
        id: check
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        run: |
          if [ -n "$CERT_B64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Podpisové secrety nejsou nastavené – DMG se nesestaví. Viz .github/workflows/release.yml."
          fi

      - name: Import Developer ID certificate
        if: steps.check.outputs.ready == 'true'
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KP="ci-keychain-$RANDOM"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PW" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          # Hlasitý fail, když .p12 neobsahuje distribuční identitu – jinak by build tiše spadl na ad-hoc.
          security find-identity -v -p codesigning "$KEYCHAIN" | tee /dev/stderr \
            | grep -q "Developer ID Application" \
            || { echo "::error::Certifikát neobsahuje identitu 'Developer ID Application' (ne Apple Development)."; exit 1; }

      - name: Build, sign and notarize DMG
        if: steps.check.outputs.ready == 'true'
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          VERSION="${VERSION#v}" ./scripts/make-dmg.sh

      - name: Attach DMG to the release
        if: steps.check.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: Memento.dmg
          generate_release_notes: true
